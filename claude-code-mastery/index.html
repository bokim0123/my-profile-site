<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 | 풀스택 개발자 포트폴리오</title>
  <meta name="description" content="사용자 중심의 웹 서비스를 만드는 풀스택 개발자 홍길동의 포트폴리오입니다.">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="fixed top-0 left-0 w-full bg-white dark:bg-slate-900 shadow-sm z-50 transition-colors">
    <nav class="max-w-4xl mx-auto flex items-center justify-between px-4 py-4" aria-label="주 메뉴">
      <a href="#home" class="text-xl font-bold text-slate-900 dark:text-white">홍길동</a>

      <!-- 데스크톱 네비게이션 -->
      <ul class="hidden md:flex items-center gap-6">
        <li><a href="#about" class="nav-link">소개</a></li>
        <li><a href="#experience" class="nav-link">경력</a></li>
        <li><a href="#skills" class="nav-link">기술</a></li>
        <li><a href="#portfolio" class="nav-link">포트폴리오</a></li>
        <li><a href="#education" class="nav-link">학력</a></li>
        <li><a href="#contact" class="nav-link">연락처</a></li>
      </ul>

      <!-- 모바일 햄버거 버튼 -->
      <button
        id="mobile-menu-btn"
        class="md:hidden"
        aria-label="메뉴 열기"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >
        <svg class="w-6 h-6 text-slate-900 dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </nav>

    <!-- 모바일 메뉴 -->
    <div id="mobile-menu" class="hidden md:hidden flex flex-col gap-4 px-4 pb-4 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700">
      <a href="#about" class="nav-link block py-2">소개</a>
      <a href="#experience" class="nav-link block py-2">경력</a>
      <a href="#skills" class="nav-link block py-2">기술</a>
      <a href="#portfolio" class="nav-link block py-2">포트폴리오</a>
      <a href="#education" class="nav-link block py-2">학력</a>
      <a href="#contact" class="nav-link block py-2">연락처</a>
    </div>
  </header>

  <main class="pt-20">
    <!-- Hero 섹션 -->
    <section id="home" class="min-h-screen flex items-center">
      <div class="max-w-4xl mx-auto px-4 w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        <!-- 텍스트 컬럼 -->
        <div>
          <p class="text-sm text-blue-600 dark:text-blue-400 font-semibold mb-4">안녕하세요,</p>
          <h1 class="text-4xl md:text-6xl font-bold text-slate-900 dark:text-white mb-4">홍길동</h1>
          <p class="text-xl md:text-2xl text-slate-600 dark:text-slate-300 mb-6">풀스택 개발자</p>
          <p class="text-lg text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
            사용자 중심의 웹 서비스를 만드는 것을 좋아합니다.
            Frontend부터 Backend까지 다양한 기술을 활용하여 완성도 높은 솔루션을 제공합니다.
          </p>

          <!-- CTA 버튼 -->
          <div class="flex gap-4 mb-8">
            <a href="#portfolio" class="btn btn-primary">포트폴리오 보기</a>
            <a href="#contact" class="btn btn-secondary">연락하기</a>
          </div>

          <!-- SNS 링크 -->
          <div class="flex gap-4">
            <!-- GitHub -->
            <a
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
              class="text-slate-600 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 transition-colors"
              title="GitHub 프로필로 이동합니다"
            >
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
            </a>

            <!-- YouTube -->
            <a
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="YouTube"
              class="text-slate-600 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 transition-colors"
              title="YouTube 채널로 이동합니다"
            >
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
              </svg>
            </a>

            <!-- Instagram -->
            <a
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
              class="text-slate-600 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 transition-colors"
              title="Instagram 계정으로 이동합니다"
            >
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm4.441 6.888h-1.111c-.497 0-.741.252-.741.75v1.111h1.853v1.852h-1.853v5.555h-1.852v-5.555h-1.111v-1.852h1.111V7.774c0-1.605.973-2.474 2.369-2.474h1.335v1.588z"/>
              </svg>
            </a>

            <!-- LinkedIn -->
            <a
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
              class="text-slate-600 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 transition-colors"
              title="LinkedIn 프로필로 이동합니다"
            >
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.475-2.236-1.986-2.236-1.081 0-1.722.731-2.004 1.438-.103.25-.129.599-.129.948v5.419h-3.554s.05-8.736 0-9.663h3.554v1.364c.429-.659 1.191-1.594 2.895-1.594 2.117 0 3.704 1.385 3.704 4.362v5.531zM5.337 8.855c-1.144 0-1.915-.759-1.915-1.71 0-.951.77-1.71 1.915-1.71 1.144 0 1.915.759 1.915 1.71 0 .951-.77 1.71-1.915 1.71zm1.6 11.597H3.738V9.644h3.199v10.808zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
              </svg>
            </a>
          </div>
        </div>

        <!-- 이미지 컬럼 (플레이스홀더) -->
        <div class="flex justify-center">
          <div class="w-full max-w-sm aspect-square bg-gradient-to-br from-blue-100 to-slate-200 dark:from-blue-900 dark:to-slate-800 rounded-full shadow-lg flex items-center justify-center">
            <svg class="w-24 h-24 text-blue-300 dark:text-blue-700" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <!-- About 섹션 (Phase 2에서 콘텐츠 작성 예정) -->
    <section id="about" class="py-20 bg-slate-50 dark:bg-slate-800">
      <div class="max-w-4xl mx-auto px-4">
        <h2 class="section-title">소개</h2>
        <!-- Phase 2에서 콘텐츠 작성 -->
      </div>
    </section>

    <!-- Experience 섹션 (Phase 2에서 콘텐츠 작성 예정) -->
    <section id="experience" class="py-20">
      <div class="max-w-4xl mx-auto px-4">
        <h2 class="section-title">경력</h2>
        <!-- Phase 2에서 콘텐츠 작성 -->
      </div>
    </section>

    <!-- Skills 섹션 (Phase 2에서 콘텐츠 작성 예정) -->
    <section id="skills" class="py-20 bg-slate-50 dark:bg-slate-800">
      <div class="max-w-4xl mx-auto px-4">
        <h2 class="section-title">기술</h2>
        <!-- Phase 2에서 콘텐츠 작성 -->
      </div>
    </section>

    <!-- Portfolio 섹션 (Phase 3에서 콘텐츠 작성 예정) -->
    <section id="portfolio" class="py-20">
      <div class="max-w-4xl mx-auto px-4">
        <h2 class="section-title">포트폴리오</h2>
        <!-- Phase 3에서 콘텐츠 작성 -->
      </div>
    </section>

    <!-- Education 섹션 (Phase 3에서 콘텐츠 작성 예정) -->
    <section id="education" class="py-20 bg-slate-50 dark:bg-slate-800">
      <div class="max-w-4xl mx-auto px-4">
        <h2 class="section-title">학력</h2>
        <!-- Phase 3에서 콘텐츠 작성 -->
      </div>
    </section>

    <!-- Contact 섹션 (Phase 4에서 콘텐츠 작성 예정) -->
    <section id="contact" class="py-20">
      <div class="max-w-4xl mx-auto px-4">
        <h2 class="section-title">연락처</h2>
        <!-- Phase 4에서 콘텐츠 작성 -->
      </div>
    </section>
  </main>

  <script src="./js/main.js" defer></script>
</body>
</html>
