<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo 앱</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-50 min-h-screen">
    <main class="container mx-auto max-w-2xl px-4 py-8">
      <section class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 md:p-8">
        <h1 class="text-3xl md:text-4xl font-bold mb-2 text-center">할 일 목록</h1>
        <p class="text-center text-gray-500 dark:text-gray-400 mb-6">
          <span id="pending-count">0</span>개 남음
        </p>

        <!-- 입력 영역 -->
        <div class="flex gap-2 mb-6">
          <input
            id="todo-input"
            type="text"
            placeholder="새로운 할 일을 입력하세요..."
            aria-label="새 할 일 입력"
            class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button
            id="add-btn"
            aria-label="할 일 추가"
            class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-medium transition"
          >
            추가
          </button>
        </div>

        <!-- 필터 탭 -->
        <div class="flex gap-2 mb-6 border-b border-gray-200 dark:border-gray-700">
          <button
            id="filter-all"
            class="filter-btn px-4 py-2 font-medium text-blue-500 border-b-2 border-blue-500 transition"
            data-filter="all"
            aria-label="모든 할 일 보기"
          >
            전체
          </button>
          <button
            id="filter-active"
            class="filter-btn px-4 py-2 font-medium text-gray-500 dark:text-gray-400 border-b-2 border-transparent hover:text-gray-700 dark:hover:text-gray-300 transition"
            data-filter="active"
            aria-label="진행 중인 할 일만 보기"
          >
            진행중
          </button>
          <button
            id="filter-completed"
            class="filter-btn px-4 py-2 font-medium text-gray-500 dark:text-gray-400 border-b-2 border-transparent hover:text-gray-700 dark:hover:text-gray-300 transition"
            data-filter="completed"
            aria-label="완료된 할 일만 보기"
          >
            완료
          </button>
        </div>

        <!-- 할 일 목록 -->
        <ul id="todo-list" class="space-y-2 mb-6" aria-label="할 일 목록" role="list">
          <!-- 동적으로 추가될 항목들 -->
        </ul>

        <!-- 완료된 항목 삭제 버튼 -->
        <button
          id="clear-completed"
          class="w-full px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium transition disabled:opacity-50 disabled:cursor-not-allowed"
          aria-label="완료된 할 일 모두 삭제"
        >
          완료된 항목 삭제
        </button>
      </section>
    </main>

    <script src="js/todo.js"></script>
  </body>
</html>
